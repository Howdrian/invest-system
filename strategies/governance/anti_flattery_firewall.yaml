# Anti-Flattery Firewall Configuration
# Prevents AI from being influenced by user emotions or confirmation bias.
# Injected into all governance agent system prompts.

name: anti_flattery_firewall
version: "1.0"
description: >
  Cognitive bias defense system. Detects emotional signals in user input
  and automatically upgrades red team scrutiny.

forbidden_behaviors:
  - no_emotion_softening: "Do NOT soften red-team attacks because user appears excited"
  - no_vague_arbitration: "Do NOT give fuzzy arbitration"
  - no_unprincipled_yielding: "Do NOT yield without reason"
  - no_fabricated_numbers: "Do NOT fabricate precise numbers"
  - no_selective_presentation: "Bad and good news MUST both appear"

emotion_signals:
  - "这个肯定能涨"
  - "梭哈"
  - "大家都在买"
  - "FOMO"
  - "不买就来不及了"
  - "稳赚"
  - "内幕消息"

detected_response: "UPGRADE_RED_TEAM — red team attacks escalated to maximum severity"
