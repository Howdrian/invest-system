# Scoring Card Config (YAML)
# Based on invest-brain agents/scoring-card.md
# 5-dimension scoring with hard gate at < 6.0

name: scoring_card
version: "1.0"
description: >
  5-dimension trading decision scoring card.
  Total 0-10. Gate: < 6.0 = NO ACTION (non-negotiable).

dimensions:
  fundamental_strength:
    weight: 0.2
    max_score: 2.0
    description: "Business/financial quality"
    stock_rubric:
      - score: 0
        criteria: "Financial deterioration, widening losses, negative FCF"
      - score: 0.5
        criteria: "Profitable but slowing or below industry"
      - score: 1.0
        criteria: "Stable earnings, reasonable valuation (PE near industry avg)"
      - score: 1.5
        criteria: "High growth + improving earnings, PEG < 1"
      - score: 2.0
        criteria: "Explosive growth + strong FCF + moat + reasonable valuation"
    commodity_rubric:
      - score: 0
        criteria: "Supply/demand balanced or oversupply, no structural gap"
      - score: 0.5
        criteria: "Gap exists but covered by inventories"
      - score: 1.0
        criteria: "Structural supply deficit, inventories falling"
      - score: 1.5
        criteria: "Widening deficit, substitute supply needs 3+ years"
      - score: 2.0
        criteria: "Severe supply crisis, no short-term relief"

  catalyst_clarity:
    weight: 0.2
    max_score: 2.0
    description: "How clear and time-bound are the catalysts"
    rubric:
      - score: 0
        criteria: "No identifiable catalyst, purely 'it will go up eventually'"
      - score: 0.5
        criteria: "Vague catalyst with uncertain timing"
      - score: 1.0
        criteria: "Clear catalyst but wide window (3-6 months)"
      - score: 1.5
        criteria: "Clear catalyst, narrow window (1-3 months)"
      - score: 2.0
        criteria: "Multiple catalysts with specific trigger dates"

  risk_reward_ratio:
    weight: 0.2
    max_score: 2.0
    description: "Asymmetric return opportunity"
    formula: "upside = target_price - current_price, downside = current_price - stop_loss, ratio = upside / downside"
    rubric:
      - score: 0
        criteria: "Ratio < 1:1 (potential loss exceeds gain)"
      - score: 0.5
        criteria: "Ratio 1:1 to 1.5:1"
      - score: 1.0
        criteria: "Ratio 1.5:1 to 2:1"
      - score: 1.5
        criteria: "Ratio 2:1 to 3:1"
      - score: 2.0
        criteria: "Ratio > 3:1 (asymmetric opportunity)"

  timing:
    weight: 0.2
    max_score: 2.0
    description: "Entry timing quality"
    rubric:
      - score: 0
        criteria: "Chasing (up 20%+) or catching a falling knife"
      - score: 0.5
        criteria: "Consolidating at highs, direction unclear"
      - score: 1.0
        criteria: "Reasonable range, no obvious chase or knife-catch"
      - score: 1.5
        criteria: "Bouncing off key support / breakout with retest confirmation"
      - score: 2.0
        criteria: "Oversold rebound after panic / reversal after VIX extreme"

  red_team_inverse:
    weight: 0.2
    max_score: 2.0
    description: "INVERTED: stronger red team = LOWER score"
    rubric:
      - score: 0
        criteria: "Red team found fatal, irrefutable risk"
      - score: 0.5
        criteria: "Red team found 2-3 severe risks, blue can only partially rebut"
      - score: 1.0
        criteria: "Red team found risks but blue has reasonable rebuttals"
      - score: 1.5
        criteria: "Red team attacks mostly rebutted, residual risk manageable"
      - score: 2.0
        criteria: "Red team found no substantive fatal risk (RARE — verify red wasn't lazy)"

gate:
  min_score: 6.0
  hard_block: true
  description: "Score < 6.0 = NO ACTION. Cannot be overridden."

position_table:
  - score_range: "< 6.0"
    action: "NO ACTION"
    position_size: "0%"
  - score_range: "6.0-7.0"
    action: "Small test"
    position_size: "2-5%"
  - score_range: "7.0-7.5"
    action: "Normal build"
    position_size: "5-10%"
  - score_range: "7.5-8.5"
    action: "Above average"
    position_size: "10-15%"
  - score_range: "> 8.5"
    action: "High conviction (RARE)"
    position_size: "15-20%"

caps:
  max_single_position: "25% of total capital"

anti_manipulation:
  - "8+ scores should be extremely rare"
  - "If 8+ appears frequently, scoring standards are too loose"
  - "6.0-7.5 is normal range for good opportunities"
  - "Record key assumptions — re-score if any break"
  - "Selling decisions also go through scoring (reverse logic)"
