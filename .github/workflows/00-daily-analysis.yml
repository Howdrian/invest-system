          # 方式五扩展：Gotify
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          
          # 方式六：PushPlus ⬅️ 新增！
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC || secrets.PUSHPLUS_TOPIC }}
          
          # 方式七：自定义 Webhook（钉钉、Bark、自建服务等）
          CUSTOM_WEBHOOK_URLS: ${{ secrets.CUSTOM_WEBHOOK_URLS }}
          CUSTOM_WEBHOOK_BEARER_TOKEN: ${{ secrets.CUSTOM_WEBHOOK_BEARER_TOKEN }}
          CUSTOM_WEBHOOK_BODY_TEMPLATE: ${{ vars.CUSTOM_WEBHOOK_BODY_TEMPLATE || secrets.CUSTOM_WEBHOOK_BODY_TEMPLATE }}
          WEBHOOK_VERIFY_SSL: ${{ vars.WEBHOOK_VERIFY_SSL || secrets.WEBHOOK_VERIFY_SSL || 'true' }}
          
          # 方式八：Discord
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MAIN_CHANNEL_ID: ${{ secrets.DISCORD_MAIN_CHANNEL_ID }}
          
          # 方式九：飞书云文档
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}

          # 方式十：AstrBot
          ASTRBOT_URL: ${{ secrets.ASTRBOT_URL }}
          ASTRBOT_TOKEN: ${{ secrets.ASTRBOT_TOKEN }}

          # 方式十一：Server酱3
          SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}

          # 方式十二：Slack
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

          # 通知路由策略（留空时保持全部已配置渠道）
          NOTIFICATION_REPORT_CHANNELS: ${{ vars.NOTIFICATION_REPORT_CHANNELS || secrets.NOTIFICATION_REPORT_CHANNELS }}
          NOTIFICATION_ALERT_CHANNELS: ${{ vars.NOTIFICATION_ALERT_CHANNELS || secrets.NOTIFICATION_ALERT_CHANNELS }}
          NOTIFICATION_SYSTEM_ERROR_CHANNELS: ${{ vars.NOTIFICATION_SYSTEM_ERROR_CHANNELS || secrets.NOTIFICATION_SYSTEM_ERROR_CHANNELS }}
          NOTIFICATION_DEDUP_TTL_SECONDS: ${{ vars.NOTIFICATION_DEDUP_TTL_SECONDS || secrets.NOTIFICATION_DEDUP_TTL_SECONDS || '0' }}
          NOTIFICATION_COOLDOWN_SECONDS: ${{ vars.NOTIFICATION_COOLDOWN_SECONDS || secrets.NOTIFICATION_COOLDOWN_SECONDS || '0' }}
          NOTIFICATION_QUIET_HOURS: ${{ vars.NOTIFICATION_QUIET_HOURS || secrets.NOTIFICATION_QUIET_HOURS }}
          NOTIFICATION_TIMEZONE: ${{ vars.NOTIFICATION_TIMEZONE || secrets.NOTIFICATION_TIMEZONE }}
          NOTIFICATION_MIN_SEVERITY: ${{ vars.NOTIFICATION_MIN_SEVERITY || secrets.NOTIFICATION_MIN_SEVERITY }}
          NOTIFICATION_DAILY_DIGEST_ENABLED: ${{ vars.NOTIFICATION_DAILY_DIGEST_ENABLED || secrets.NOTIFICATION_DAILY_DIGEST_ENABLED || 'false' }}

          # ==========================================
          # 自选股配置
          # ==========================================
          STOCK_LIST: ${{ vars.STOCK_LIST || secrets.STOCK_LIST || '600519,000858,300750,002594,601318,000001,600036,000333,300059,600276,601899,002415,000725,600900,601857,AAPL,MSFT,NVDA,GOOGL,AMZN,META,TSLA,BABA,SPY,QQQ,IWM' }}
          PORTFOLIO_HOLDINGS: ${{ vars.PORTFOLIO_HOLDINGS || secrets.PORTFOLIO_HOLDINGS || '' }}
          MARKET_REVIEW_REGION: ${{ vars.MARKET_REVIEW_REGION || secrets.MARKET_REVIEW_REGION || 'cn' }}
          MARKET_REVIEW_COLOR_SCHEME: ${{ vars.MARKET_REVIEW_COLOR_SCHEME || secrets.MARKET_REVIEW_COLOR_SCHEME || 'green_up' }}
          
          # ==========================================
          # 运行配置 ⬅️ 新增！
          # ==========================================
          REPORT_TYPE: ${{ vars.REPORT_TYPE || secrets.REPORT_TYPE || 'simple' }}
          REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE || secrets.REPORT_LANGUAGE || '' }}
          REPORT_SHOW_LLM_MODEL: ${{ vars.REPORT_SHOW_LLM_MODEL || secrets.REPORT_SHOW_LLM_MODEL || 'true' }}
          SINGLE_STOCK_NOTIFY: ${{ vars.SINGLE_STOCK_NOTIFY || secrets.SINGLE_STOCK_NOTIFY || 'false' }}
          MARKET_REVIEW_ENABLED: ${{ vars.MARKET_REVIEW_ENABLED || secrets.MARKET_REVIEW_ENABLED || 'true' }}
          ANALYSIS_DELAY: ${{ vars.ANALYSIS_DELAY || secrets.ANALYSIS_DELAY || '0' }}
          TRADING_DAY_CHECK_ENABLED: ${{ vars.TRADING_DAY_CHECK_ENABLED || secrets.TRADING_DAY_CHECK_ENABLED || 'true' }}
          AGENT_MODE: ${{ vars.AGENT_MODE || secrets.AGENT_MODE || 'true' }}
          AGENT_ARCH: ${{ vars.AGENT_ARCH || secrets.AGENT_ARCH || 'multi' }}
          AGENT_ORCHESTRATOR_MODE: ${{ vars.AGENT_ORCHESTRATOR_MODE || secrets.AGENT_ORCHESTRATOR_MODE || 'governed' }}
          AGENT_GOVERNED_PARALLEL: ${{ vars.AGENT_GOVERNED_PARALLEL || secrets.AGENT_GOVERNED_PARALLEL || 'true' }}
          AGENT_GOVERNED_PARALLEL_MAX_WORKERS: ${{ vars.AGENT_GOVERNED_PARALLEL_MAX_WORKERS || secrets.AGENT_GOVERNED_PARALLEL_MAX_WORKERS || '3' }}
          AGENT_GOVERNED_DAILY_LIMIT: ${{ vars.AGENT_GOVERNED_DAILY_LIMIT || secrets.AGENT_GOVERNED_DAILY_LIMIT || '3' }}
          
          # ==========================================
          # 系统配置
          # ==========================================
          LOG_LEVEL: INFO
          MAX_WORKERS: ${{ vars.MAX_WORKERS || secrets.MAX_WORKERS || '1' }}
          # 筹码分布：默认 false（云端接口不稳定）；需启用时在 Settings → Variables 添加 ENABLE_CHIP_DISTRIBUTION=true
          ENABLE_CHIP_DISTRIBUTION: ${{ vars.ENABLE_CHIP_DISTRIBUTION || secrets.ENABLE_CHIP_DISTRIBUTION || 'false' }}
          # 实时行情数据源优先级（腾讯有量比且稳定，推荐首选）
          # 可选值: tencent, akshare_sina, efinance, akshare_em, tushare
          # 如果有 Tushare Pro 高积分账号，可将 tushare 放在首位
          REALTIME_SOURCE_PRIORITY: ${{ vars.REALTIME_SOURCE_PRIORITY || 'tencent,akshare_sina,efinance,akshare_em' }}
          
        run: |
          # 处理 LITELLM YAML 配置文件
          if [ -n "$LITELLM_CONFIG_YAML" ] && [ -n "$LITELLM_CONFIG" ]; then
            echo "📝 使用 GitHub Actions Secrets/Variables 中的 LITELLM_CONFIG_YAML 配置"
            # 确保目录存在
            mkdir -p "$(dirname "$LITELLM_CONFIG")"
            # 写入配置文件（覆盖已有文件）
            echo "$LITELLM_CONFIG_YAML" > "$LITELLM_CONFIG"
            echo "✅ LITELLM 配置文件已写入: $LITELLM_CONFIG"
          fi

          # 判断运行模式
          MODE="${{ github.event.inputs.mode || 'full' }}"
          
          echo "=========================================="
          echo "🚀 A股自选股智能分析系统"
          echo "=========================================="
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "🎯 运行模式: $MODE"
          echo "📊 自选股: $STOCK_LIST"
          echo "📝 报告类型: $REPORT_TYPE"
          echo "🤖 Agent: mode=$AGENT_MODE arch=$AGENT_ARCH orchestrator=$AGENT_ORCHESTRATOR_MODE governed_parallel=$AGENT_GOVERNED_PARALLEL"
          echo ""
          echo "=========================================="
          echo "📋 配置检查"
          echo "=========================================="
          echo "【AI 配置】"
          if [ -n "$LITELLM_CONFIG" ] || [ -n "$LITELLM_API_KEY" ] || [ -n "$LITELLM_MODEL" ] || [ -n "$ANSPIRE_API_KEYS" ]; then
            echo "  LiteLLM: ✅ 已配置"
          else
            echo "  LiteLLM: ❌ 未配置"
          fi
          echo "  Gemini API Key: $([ -n "$GEMINI_API_KEY" ] && echo '✅ 已配置' || echo '❌ 未配置')"
          echo "  DeepSeek Key:   $([ -n "$DEEPSEEK_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Anspire Key:    $([ -n "$ANSPIRE_API_KEYS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  AIHubMix Key:   $([ -n "$AIHUBMIX_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  OpenAI API Key: $([ -n "$OPENAI_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Anthropic Key:  $([ -n "$ANTHROPIC_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo ""
          echo "【数据源】"
          echo "  Tushare Token: $([ -n "$TUSHARE_TOKEN" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  FMP API Key: $([ -n "$FMP_API_KEY" ] && echo '✅ 已配置（宏观增强）' || echo '⚪ 未配置（宏观降级可运行）')"
          echo "  Longbridge: $([ -n "$LONGBRIDGE_APP_KEY" ] && [ -n "$LONGBRIDGE_APP_SECRET" ] && [ -n "$LONGBRIDGE_ACCESS_TOKEN" ] && echo '✅ 已配置（美股/港股行情补充）' || echo '⚪ 未配置（仅 YFinance 等，无长桥调用）')"
          echo ""
          echo "【搜索引擎】"
          echo "  Bocha API Keys: $([ -n "$BOCHA_API_KEYS$BOCHA_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Tavily API Keys: $([ -n "$TAVILY_API_KEYS$TAVILY_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  SerpAPI Keys: $([ -n "$SERPAPI_API_KEYS$SERPAPI_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  MiniMax API Keys: $([ -n "$MINIMAX_API_KEYS$MINIMAX_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Brave API Keys: $([ -n "$BRAVE_API_KEYS$BRAVE_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  SearXNG Base URLs: $([ -n "$SEARXNG_BASE_URLS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          case "${SEARXNG_PUBLIC_INSTANCES_ENABLED,,}" in
            0|false|no|off)
              echo "  SearXNG Public Instances: ❌ 已禁用"
              ;;
            "")
              echo "  SearXNG Public Instances: ✅ 默认开启"
              ;;
            *)
              echo "  SearXNG Public Instances: ✅ 已启用"
              ;;
          esac
          echo ""
          echo "【通知渠道】"
          echo "  PushPlus: $([ -n "$PUSHPLUS_TOKEN" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  ntfy: $([ -n "$NTFY_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Gotify: $([ -n "$GOTIFY_URL" ] && [ -n "$GOTIFY_TOKEN" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  企业微信: $([ -n "$WECHAT_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  飞书: $([ -n "$FEISHU_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Telegram: $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Discord: $([ -n "$DISCORD_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  AstrBot: $([ -n "$ASTRBOT_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Slack: $(([ -n "$SLACK_WEBHOOK_URL" ] || ([ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ])) && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "=========================================="
          echo ""
          
          # 构建命令行参数
          FORCE_RUN_ARG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_RUN_ARG="--force-run"
            echo "⚡ 已启用强制运行模式（跳过交易日检查）"
          fi

          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          RUN_STATUS_DIR="reports/run_status"
          mkdir -p "$RUN_STATUS_DIR"
          echo "$TODAY" > "$RUN_STATUS_DIR/run_date.txt"
          echo "started" > "$RUN_STATUS_DIR/market_cycle_status.txt"
          echo "not_started" > "$RUN_STATUS_DIR/stock_analysis_status.txt"
          echo "$STOCK_LIST" > "$RUN_STATUS_DIR/observation_universe.txt"

          # governed 支撑上下文：失败不阻断日报生成
          python -m src.macro.official_sources --refresh || echo "⚠️ 宏观上下文刷新失败，market-cycle 将降级运行"
          python -m src.intel.market_heat --symbols "$STOCK_LIST" --output-dir "$MARKET_HEAT_OUTPUT_DIR" --live || echo "⚠️ 市场热度摘要生成失败，market-cycle 将降级运行"
          python -m src.prediction_market.polymarket --output-dir reports/prediction_market --live || echo "⚠️ Polymarket 只读概率刷新失败，market-cycle 将降级运行"

          # 先生成大盘/宏观/源健康/候选池，避免个股深跑超时导致当天日报空白
          echo "🧭 生成云端看盘三件套: reports/market_cycle/$TODAY"
          if python -m src.market_cycle \
            --symbols "$STOCK_LIST" \
            --output-dir "reports/market_cycle/$TODAY" \
            --market-heat-output-dir "$MARKET_HEAT_OUTPUT_DIR" \
            --prediction-market-output-dir reports/prediction_market \
            --date "$TODAY"; then
            echo "success" > "$RUN_STATUS_DIR/market_cycle_status.txt"
          else
            echo "failed" > "$RUN_STATUS_DIR/market_cycle_status.txt"
            echo "⚠️ market-cycle 生成失败；后续个股分析仍会尝试运行"
          fi

          # 自选池是观察宇宙；每日 governed 深评只取候选池前 N 只，避免 26 只全量深跑导致 workflow 超时。
          GOVERNED_STOCK_LIST="$(
            TODAY_ENV="$TODAY" \
            ORIGINAL_STOCK_LIST="$STOCK_LIST" \
            MAX_GOVERNED_STOCKS="${AGENT_GOVERNED_DAILY_LIMIT:-3}" \
            RUN_STATUS_DIR="$RUN_STATUS_DIR" \
            python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          today = os.environ["TODAY_ENV"]
          original = [s.strip() for s in os.environ.get("ORIGINAL_STOCK_LIST", "").split(",") if s.strip()]
          try:
              limit = int(os.environ.get("MAX_GOVERNED_STOCKS") or "3")
          except ValueError:
              limit = 3
          limit = max(1, min(limit, 6))

          def normalize(symbol):
              value = str(symbol or "").strip()
              if not value:
                  return ""
              value = value.replace(" ", "")
              value = re.sub(r"^(SH|SZ|BJ)(?=\d{6}$)", "", value, flags=re.IGNORECASE)
              value = re.sub(r"\.(SH|SZ|BJ)$", "", value, flags=re.IGNORECASE)
              return value.upper() if not value.isdigit() else value

          def symbol_of(item):
              if isinstance(item, str):
                  return item
              if isinstance(item, dict):
                  return item.get("symbol") or item.get("code") or item.get("ticker") or item.get("stock_code") or ""
              return ""

          def append_unique(target, source):
              for raw in source:
                  symbol = normalize(raw)
                  if symbol and symbol not in target:
                      target.append(symbol)

          portfolio_symbols = []
          portfolio_governed_symbols = []
          portfolio_light_review_symbols = []
          portfolio_omitted = []
          try:
              from src.intel.portfolio_holdings import build_portfolio_holding_snapshot

              portfolio = build_portfolio_holding_snapshot(max_symbols=None)
              portfolio_symbols = [normalize(s) for s in portfolio.get("symbols") or [] if normalize(s)]
              portfolio_governed_symbols = [normalize(s) for s in portfolio.get("governed_symbols") or [] if normalize(s)]
              portfolio_light_review_symbols = [normalize(s) for s in portfolio.get("light_review_symbols") or [] if normalize(s)]
              portfolio_omitted = [normalize(s) for s in portfolio.get("omitted_symbols") or [] if normalize(s)]
              status_dir = Path(os.environ.get("RUN_STATUS_DIR") or "reports/run_status")
              status_dir.mkdir(parents=True, exist_ok=True)
              (status_dir / "portfolio_holding_symbols.txt").write_text(",".join(portfolio_symbols), encoding="utf-8")
              (status_dir / "portfolio_governed_symbols.txt").write_text(",".join(portfolio_governed_symbols), encoding="utf-8")
              (status_dir / "portfolio_light_review_symbols.txt").write_text(",".join(portfolio_light_review_symbols), encoding="utf-8")
              (status_dir / "portfolio_holding_omitted_symbols.txt").write_text(",".join(portfolio_omitted), encoding="utf-8")
              (status_dir / "portfolio_holding_summary.json").write_text(json.dumps(portfolio, ensure_ascii=False, indent=2), encoding="utf-8")
          except Exception as exc:
              status_dir = Path(os.environ.get("RUN_STATUS_DIR") or "reports/run_status")
              status_dir.mkdir(parents=True, exist_ok=True)
              (status_dir / "portfolio_holding_symbols.txt").write_text("", encoding="utf-8")
              (status_dir / "portfolio_governed_symbols.txt").write_text("", encoding="utf-8")
              (status_dir / "portfolio_light_review_symbols.txt").write_text("", encoding="utf-8")
              (status_dir / "portfolio_holding_omitted_symbols.txt").write_text("", encoding="utf-8")
              (status_dir / "portfolio_holding_summary.json").write_text(
                  json.dumps({"schema": "portfolio_holding_snapshot_v1", "status": "degraded", "symbols": [], "governed_symbols": [], "light_review_symbols": [], "warnings": [str(exc)]}, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

          candidate_symbols = []
          candidate_reasons = []
          queue_path = Path("reports/market_cycle") / today / "11_deep_review_queue.json"
          if queue_path.exists():
              queue = json.loads(queue_path.read_text(encoding="utf-8"))
              entries = queue.get("auto_governed_candidates") or []
              if isinstance(entries, dict):
                  entries = entries.values()
              for item in entries:
                  symbol = normalize(symbol_of(item))
                  if symbol and symbol not in candidate_symbols:
                      candidate_symbols.append(symbol)
              if candidate_symbols:
                  candidate_reasons.append("auto_governed_candidates")

              entries = queue.get("candidates") or []
              if isinstance(entries, dict):
                  entries = entries.values()
              for item in entries:
                  if not isinstance(item, dict) or item.get("verdict") != "DEEP_REVIEW_NOW":
                      continue
                  symbol = normalize(symbol_of(item))
                  if symbol and symbol not in candidate_symbols:
                      candidate_symbols.append(symbol)
              if candidate_symbols and "auto_governed_candidates" not in candidate_reasons:
                  candidate_reasons.append("deep_review_now")

          picked = []
          reason_parts = []
          if portfolio_governed_symbols:
              append_unique(picked, portfolio_governed_symbols)
              reason_parts.append("portfolio_holdings")
          if candidate_symbols:
              append_unique(picked, candidate_symbols)
              reason_parts.extend(candidate_reasons or ["deep_review_now"])
          if not picked:
              picked = [normalize(s) for s in original if normalize(s)]
              reason_parts.append("fallback_stock_list")
          selection_reason = "+".join(dict.fromkeys(reason_parts)) or "empty_selection"

          status_dir = Path(os.environ.get("RUN_STATUS_DIR") or "reports/run_status")
          status_dir.mkdir(parents=True, exist_ok=True)
          (status_dir / "governed_selection_reason.txt").write_text(selection_reason, encoding="utf-8")
          if len(picked) > limit:
              omitted = picked[limit:]
              existing = (status_dir / "portfolio_holding_omitted_symbols.txt").read_text(encoding="utf-8") if (status_dir / "portfolio_holding_omitted_symbols.txt").exists() else ""
              merged_omitted = [s for s in (existing.split(",") if existing else []) if s] + omitted
              (status_dir / "governed_omitted_symbols.txt").write_text(",".join(dict.fromkeys(merged_omitted)), encoding="utf-8")
          else:
              (status_dir / "governed_omitted_symbols.txt").write_text("", encoding="utf-8")

          print(",".join(picked[:limit]))
          PY
          )"
          if [ -z "$GOVERNED_STOCK_LIST" ]; then
            GOVERNED_STOCK_LIST="$(echo "$STOCK_LIST" | cut -d, -f1)"
          fi
          echo "$GOVERNED_STOCK_LIST" > "$RUN_STATUS_DIR/governed_stock_list.txt"
          echo "🤖 governed_deep_review_symbols=$GOVERNED_STOCK_LIST limit=${AGENT_GOVERNED_DAILY_LIMIT:-3}"
          echo "💼 portfolio_all_symbols=$(cat "$RUN_STATUS_DIR/portfolio_holding_symbols.txt" 2>/dev/null || true)"
          echo "💼 portfolio_governed_symbols=$(cat "$RUN_STATUS_DIR/portfolio_governed_symbols.txt" 2>/dev/null || true)"
          echo "💼 portfolio_light_review_symbols=$(cat "$RUN_STATUS_DIR/portfolio_light_review_symbols.txt" 2>/dev/null || true)"

          run_governed_analysis() {
            echo "started" > "$RUN_STATUS_DIR/stock_analysis_status.txt"
            MAIN_EXIT=0
            ANALYSIS_RUN_DATE="$TODAY" python main.py --stocks "$GOVERNED_STOCK_LIST" --no-market-review --force-run || MAIN_EXIT=$?

            VALIDATE_EXIT=0
            python scripts/validate_governed_run.py \
              --run-date "$TODAY" \
              --mode "$MODE" \
              --expected-symbols "$GOVERNED_STOCK_LIST" \
              --reports-dir reports \
              --status-dir "$RUN_STATUS_DIR" \
              --main-exit-code "$MAIN_EXIT" \
              --fail-on-non-success || VALIDATE_EXIT=$?

            # 刷新 source health，让 governed_reports 反映个股分析后的当天真实产物。
            python -m src.market_cycle \
              --symbols "$STOCK_LIST" \
              --output-dir "reports/market_cycle/$TODAY" \
              --market-heat-output-dir "$MARKET_HEAT_OUTPUT_DIR" \
              --prediction-market-output-dir reports/prediction_market \
              --date "$TODAY" || echo "⚠️ governed 后 source health 刷新失败"

            if [ "$VALIDATE_EXIT" -ne 0 ]; then
              echo "::error::Governed stock analysis did not complete for $TODAY"
              cat "$RUN_STATUS_DIR/governed_result_summary.json" 2>/dev/null || true
              exit "$VALIDATE_EXIT"
            fi
          }

          # 执行个股 governed 深评
          if [ "$MODE" = "market-only" ]; then
            echo "skipped_market_only" > "$RUN_STATUS_DIR/stock_analysis_status.txt"
            echo "📊 market-only 模式：已生成 market-cycle，跳过个股 governed 深评"
          elif [ "$MODE" = "stocks-only" ]; then
            run_governed_analysis
          else
            # full 模式的大盘部分已经由 market-cycle 产出；这里避免重复跑旧版大盘复盘导致超时。
            run_governed_analysis
          fi
          echo "macro status: see market-cycle log above"
          echo "polymarket status: see market-cycle log above"
          echo "🤖 governed_parallel=$AGENT_GOVERNED_PARALLEL max_workers=$AGENT_GOVERNED_PARALLEL_MAX_WORKERS daily_limit=${AGENT_GOVERNED_DAILY_LIMIT:-3}"
      
      - name: 上传分析报告
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: analysis-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30
      
      - name: 显示运行结果
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 分析完成"
          echo "=========================================="
          if [ -d "reports" ] && [ "$(ls -A reports 2>/dev/null)" ]; then
            echo "生成的报告:"
            find reports -maxdepth 3 -type f | sort
          else
            echo "⚠️ 未生成报告文件"
          fi
          echo ""
          if [ -f "logs/stock_analysis_$(date +%Y%m%d).log" ]; then
            echo "📜 最近日志（最后 30 行）:"
            tail -30 logs/stock_analysis_*.log 2>/dev/null || echo "无日志"
          fi

      - name: 提交报告到仓库
        if: always()
        env:
          STOCK_LIST: ${{ vars.STOCK_LIST || secrets.STOCK_LIST || '600519,000858,300750,002594,601318,000001,600036,000333,300059,600276,601899,002415,000725,600900,601857,AAPL,MSFT,NVDA,GOOGL,AMZN,META,TSLA,BABA,SPY,QQQ,IWM' }}
          PORTFOLIO_HOLDINGS: ${{ vars.PORTFOLIO_HOLDINGS || secrets.PORTFOLIO_HOLDINGS || '' }}
          MARKET_HEAT_OUTPUT_DIR: ${{ vars.MARKET_HEAT_OUTPUT_DIR || secrets.MARKET_HEAT_OUTPUT_DIR || 'reports/market_heat' }}
          AGENT_GOVERNED_PARALLEL: ${{ vars.AGENT_GOVERNED_PARALLEL || secrets.AGENT_GOVERNED_PARALLEL || 'true' }}
          AGENT_GOVERNED_PARALLEL_MAX_WORKERS: ${{ vars.AGENT_GOVERNED_PARALLEL_MAX_WORKERS || secrets.AGENT_GOVERNED_PARALLEL_MAX_WORKERS || '3' }}
          AGENT_GOVERNED_DAILY_LIMIT: ${{ vars.AGENT_GOVERNED_DAILY_LIMIT || secrets.AGENT_GOVERNED_DAILY_LIMIT || '3' }}
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          MARKET_CYCLE_REPORTS="reports/market_cycle/$TODAY"
          MARKET_CYCLE_DOCS="docs/market_cycle/$TODAY"
          RUN_STATUS_DIR="reports/run_status"
          MARKET_CYCLE_STATUS="$(cat "$RUN_STATUS_DIR/market_cycle_status.txt" 2>/dev/null || echo missing)"
          STOCK_ANALYSIS_STATUS="$(cat "$RUN_STATUS_DIR/stock_analysis_status.txt" 2>/dev/null || echo missing)"
          GOVERNED_STOCK_LIST_ACTUAL="$(cat "$RUN_STATUS_DIR/governed_stock_list.txt" 2>/dev/null || echo '')"
          GOVERNED_SELECTION_REASON="$(cat "$RUN_STATUS_DIR/governed_selection_reason.txt" 2>/dev/null || echo missing)"
          PORTFOLIO_HOLDING_SYMBOLS="$(cat "$RUN_STATUS_DIR/portfolio_holding_symbols.txt" 2>/dev/null || echo '')"
          PORTFOLIO_GOVERNED_SYMBOLS="$(cat "$RUN_STATUS_DIR/portfolio_governed_symbols.txt" 2>/dev/null || echo '')"
          PORTFOLIO_LIGHT_REVIEW_SYMBOLS="$(cat "$RUN_STATUS_DIR/portfolio_light_review_symbols.txt" 2>/dev/null || echo '')"
          GOVERNED_OMITTED_SYMBOLS="$(cat "$RUN_STATUS_DIR/governed_omitted_symbols.txt" 2>/dev/null || echo '')"
          GOVERNED_RESULT_SUMMARY="$RUN_STATUS_DIR/governed_result_summary.json"
          OBSERVATION_UNIVERSE="$(cat "$RUN_STATUS_DIR/observation_universe.txt" 2>/dev/null || echo "$STOCK_LIST")"
          TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
          TODAY_COMPACT="${TODAY//-/}"

          # 先同步远端分支，避免多个 Actions 或人工提交让最终 push 被 non-fast-forward 拒绝。
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

          mkdir -p docs/daily "$MARKET_CYCLE_DOCS" docs/market_heat
          DAILY_INDEX="docs/daily/index.md"
          # 生成每日投研入口；不要写 lowercase docs index，避免和既有 docs/INDEX.md 文档中心在 macOS 上大小写冲突
          echo "# 投研日报 — $TODAY" > "$DAILY_INDEX"
          echo "" >> "$DAILY_INDEX"
          echo "> 自动生成于 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') 北京时" >> "$DAILY_INDEX"
          echo "" >> "$DAILY_INDEX"
          echo "## 自选股" >> "$DAILY_INDEX"
          echo "\`$OBSERVATION_UNIVERSE\`" >> "$DAILY_INDEX"
          echo "" >> "$DAILY_INDEX"
          echo "## 运行状态" >> "$DAILY_INDEX"
          echo "- Market cycle: \`$MARKET_CYCLE_STATUS\`" >> "$DAILY_INDEX"
          echo "- Governed stock analysis: \`$STOCK_ANALYSIS_STATUS\`" >> "$DAILY_INDEX"
          echo "- Governed deep-review symbols: \`${GOVERNED_STOCK_LIST_ACTUAL:-none}\`" >> "$DAILY_INDEX"
          echo "- Governed selection reason: \`$GOVERNED_SELECTION_REASON\`" >> "$DAILY_INDEX"
          echo "- Portfolio holdings: \`${PORTFOLIO_HOLDING_SYMBOLS:-none}\`" >> "$DAILY_INDEX"
          echo "- Portfolio governed-eligible: \`${PORTFOLIO_GOVERNED_SYMBOLS:-none}\`" >> "$DAILY_INDEX"
          echo "- Portfolio light-review only: \`${PORTFOLIO_LIGHT_REVIEW_SYMBOLS:-none}\`" >> "$DAILY_INDEX"
          echo "- Governed omitted symbols: \`${GOVERNED_OMITTED_SYMBOLS:-none}\`" >> "$DAILY_INDEX"
          echo "- Governed daily limit: \`${AGENT_GOVERNED_DAILY_LIMIT:-3}\`" >> "$DAILY_INDEX"
          if [ -f "$GOVERNED_RESULT_SUMMARY" ]; then
            SUMMARY_PATH="$GOVERNED_RESULT_SUMMARY" python - <<'PY' >> "$DAILY_INDEX"
          import json
          import os
          from pathlib import Path
          summary = json.loads(Path(os.environ["SUMMARY_PATH"]).read_text(encoding="utf-8"))
          print(f"- Governed completed symbols: `{','.join(summary.get('completed_symbols') or []) or 'none'}`")
          print(f"- Governed missing symbols: `{','.join(summary.get('missing_symbols') or []) or 'none'}`")
          print(f"- Governed today report exists: `{summary.get('today_report_exists')}`")
          if summary.get("reasons"):
              print(f"- Governed failure reasons: `{','.join(summary.get('reasons') or [])}`")
          PY
          fi
          if [ "$MARKET_CYCLE_STATUS" = "started" ] || [ "$STOCK_ANALYSIS_STATUS" = "started" ]; then
            echo "- ⚠️ 有步骤只写入了 started 状态，表示 Actions 可能在完成前被取消或超时；以本页文件链接和 Actions 日志为准。" >> "$DAILY_INDEX"
          fi
          echo "" >> "$DAILY_INDEX"
          echo "## 大盘 / 云端看盘三件套" >> "$DAILY_INDEX"
          if [ -f "$MARKET_CYCLE_REPORTS/summary.md" ]; then
            cp -r "$MARKET_CYCLE_REPORTS"/* "$MARKET_CYCLE_DOCS"/
            echo "- [一屏总览](../market_cycle/$TODAY/00_one_screen_brief.html)" >> "$DAILY_INDEX"
            echo "- [宏观与地缘融合](../market_cycle/$TODAY/01_macro_review.html)" >> "$DAILY_INDEX"
            echo "- [筛选漏斗](../market_cycle/$TODAY/09_screening_funnel.md)" >> "$DAILY_INDEX"
            echo "- [深评候选队列](../market_cycle/$TODAY/11_deep_review_queue.md)" >> "$DAILY_INDEX"
            echo "- [市场策略总控](../market_cycle/$TODAY/14_market_strategy.html)" >> "$DAILY_INDEX"
            echo "- [数据源健康](../market_cycle/$TODAY/13_source_health.html)" >> "$DAILY_INDEX"
            TODAY_ENV="$TODAY" python - <<'PY' >> "$DAILY_INDEX"
          import json
          import os
          from pathlib import Path
          today = os.environ["TODAY_ENV"]
          health_path = Path("docs/market_cycle") / today / "13_source_health.json"
          strategy_path = Path("docs/market_cycle") / today / "14_market_strategy.json"
          macro_path = Path("docs/market_cycle") / today / "01_macro_review.json"
          queue_path = Path("docs/market_cycle") / today / "11_deep_review_queue.json"
          if health_path.exists():
              health = json.loads(health_path.read_text(encoding="utf-8"))
              print(f"- Macro context: `{health.get('macro_status')}`")
              print(f"- Source health: `{health.get('usability_verdict')}`")
              print(f"- Trade review usability: `{health.get('trade_review_usability')}`")
              rows = {row.get("component"): row for row in health.get("rows") or [] if isinstance(row, dict)}
              portfolio = rows.get("portfolio_holdings") or {}
              if portfolio:
                  print(f"- Portfolio holdings status: `{portfolio.get('holding_status') or portfolio.get('status')}` / selected=`{portfolio.get('selected_count', 0)}` / governed=`{portfolio.get('governed_count', 0)}` / light=`{portfolio.get('light_review_count', 0)}`")
          if macro_path.exists():
              macro = json.loads(macro_path.read_text(encoding="utf-8"))
              print(f"- Macro review: `{macro.get('status')}` / `{macro.get('confidence')}`")
              print(f"- Polymarket: `{macro.get('prediction_market_status')}`")
          if queue_path.exists():
              queue = json.loads(queue_path.read_text(encoding="utf-8"))
              print(f"- Deep review candidates: `{len(queue.get('candidates') or [])}`")
              print(f"- Auto governed candidates: `{len(queue.get('auto_governed_candidates') or [])}`")
              print(f"- Watch-only candidates: `{len(queue.get('watch_only') or [])}`")
          if strategy_path.exists():
              strategy = json.loads(strategy_path.read_text(encoding="utf-8"))
              print(f"- Regime: `{strategy.get('regime')}`")
          PY
          else
            echo "- ⚠️ market-cycle 三件套未生成" >> "$DAILY_INDEX"
          fi
          echo "- Governed parallel: \`$AGENT_GOVERNED_PARALLEL\` / max_workers=\`$AGENT_GOVERNED_PARALLEL_MAX_WORKERS\`" >> "$DAILY_INDEX"
          echo "" >> "$DAILY_INDEX"
          echo "## 个股 Governed 报告" >> "$DAILY_INDEX"
          echo "| 文件 | 说明 |" >> "$DAILY_INDEX"
          echo "|---|---|" >> "$DAILY_INDEX"
          TODAY_REPORT="reports/report_${TODAY_COMPACT}.md"
          if [ -f "$TODAY_REPORT" ]; then
            echo "| [report_${TODAY_COMPACT}.md](../report_${TODAY_COMPACT}.md) | 今日 governed 个股报告 |" >> "$DAILY_INDEX"
          else
            echo "| 今日报告缺失 | \`reports/report_${TODAY_COMPACT}.md\` 未生成；看上方运行状态和 Actions 日志 |" >> "$DAILY_INDEX"
          fi
          if [ -f "reports/governed_results.json" ]; then
            echo "| [governed_results.json](../governed_results.json) | 今日 governed 结构化结果 |" >> "$DAILY_INDEX"
          fi
          echo "" >> "$DAILY_INDEX"
          echo "---" >> "$DAILY_INDEX"
          echo "完整的 Actions 运行日志：[查看](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$DAILY_INDEX"
          cp "$DAILY_INDEX" "docs/daily/$TODAY.md"
          # 把顶层个股报告也移到 docs 目录；market-cycle 使用专属目录
          cp "reports/report_${TODAY_COMPACT}.md" docs/ 2>/dev/null || true
          if [ -f "reports/governed_results.json" ]; then
            cp "reports/governed_results.json" docs/
          else
            rm -f docs/governed_results.json
          fi
          cp "$MARKET_HEAT_OUTPUT_DIR"/* docs/market_heat/ 2>/dev/null || true
          echo "🎨 生成增强首页..."
          python src/render_homepage.py \
            --reports-dir reports \
            --market-cycle-dir "reports/market_cycle" \
            --macro-cache data/macro_cache/macro_context_latest.json \
            --market-heat-dir "$MARKET_HEAT_OUTPUT_DIR" \
            --output docs/index.html \
            --stock-list "$STOCK_LIST"

          git config user.name "invest-bot"
          git config user.email "bot@invest-system.local"
          git add docs/
          git diff --staged --quiet || git commit -m "report: $TODAY 投研日报"
          git push origin "HEAD:${TARGET_BRANCH}" || {
            echo "⚠️ 首次 push 被远端更新拒绝，拉取远端后重试"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:${TARGET_BRANCH}"
          }
